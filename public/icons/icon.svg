<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1e"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FA233B"/>
      <stop offset="100%" stop-color="#FF5E62"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- iOS App Icon Squircle Background -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <rect width="512" height="512" rx="115" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Glowing Ambient Radial -->
  <circle cx="256" cy="256" r="160" fill="#FA233B" opacity="0.22" filter="url(#glow)"/>

  <!-- Musical Note 'J' Shape -->
  <g transform="translate(110, 85) scale(6.2)">
    <path 
      d="M26 8 C26 8 36 6 38 15 C33 13 28 15 28 17 V29 C28 35.6 22.6 41 16 41 C9.4 41 4 35.6 4 29 C4 23 8.8 18.2 14.8 18.2 C17.2 18.2 19.4 19 21.2 20.4 V8 Z" 
      fill="url(#roseGrad)"
      filter="url(#glow)"
    />
    <ellipse 
      cx="14" 
      cy="28" 
      rx="5" 
      ry="4" 
      transform="rotate(-25 14 28)" 
      fill="white" 
      opacity="0.35" 
    />
  </g>
</svg>
