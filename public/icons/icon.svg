<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1e"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FA233B"/>
      <stop offset="100%" stop-color="#FF5E62"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- iOS App Icon Squircle Background -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <rect width="512" height="512" rx="115" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Glowing Ambient Radial -->
  <circle cx="256" cy="256" r="160" fill="#FA233B" opacity="0.18" filter="url(#glow)"/>

  <!-- Audio Bars / Dynamic Waves -->
  <g transform="translate(136, 156)">
    <!-- Bar 1 -->
    <rect x="0" y="80" width="36" height="120" rx="18" fill="#ffffff" opacity="0.85"/>
    <!-- Bar 2 -->
    <rect x="68" y="20" width="36" height="180" rx="18" fill="url(#roseGrad)" filter="url(#glow)"/>
    <!-- Bar 3 -->
    <rect x="136" y="50" width="36" height="150" rx="18" fill="#ffffff"/>
    <!-- Bar 4 -->
    <rect x="204" y="90" width="36" height="110" rx="18" fill="#ffffff" opacity="0.75"/>
  </g>

  <!-- Dot Accents -->
  <circle cx="256" cy="410" r="6" fill="#FA233B"/>
</svg>
